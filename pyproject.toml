[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "university-db-v1"
version = "0.1.0"
description = "University DB v1 crawler + extractor pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
university-db = "university_db.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
